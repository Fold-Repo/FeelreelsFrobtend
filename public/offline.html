<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="robots" content="noindex" />
        <meta name="theme-color" content="#f6f5f1" />
        <title>You're offline · FeelReels</title>
        <style>
            * { box-sizing: border-box; margin: 0; }
            body { min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f6f5f1; color: #141414; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
            .card { max-width: 380px; background: #fff; border-radius: 32px; padding: 40px 28px; box-shadow: 0 30px 60px -30px rgba(20, 20, 20, 0.25); }
            .mark { width: 56px; height: 56px; margin: 0 auto 24px; }
            h1 { font-size: 28px; letter-spacing: -0.03em; }
            p { margin-top: 10px; color: #6f6c66; line-height: 1.6; }
            button { margin-top: 28px; height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #141414; color: #fff; font: 600 15px inherit; cursor: pointer; }
        </style>
    </head>
    <body>
        <div class="card">
            <svg class="mark" viewBox="0 0 64 64"><rect width="64" height="64" rx="18" fill="#141414"/><rect x="13" y="16" width="20" height="32" rx="6" fill="#f3b53f" transform="rotate(-14 23 32)"/><rect x="21" y="14" width="20" height="34" rx="6" fill="#ff9a7f" transform="rotate(-4 31 31)"/><rect x="29" y="13" width="22" height="38" rx="6" fill="#ff5a3c"/><path d="M36 25v14l11-7z" fill="#fff"/></svg>
            <h1>You're offline</h1>
            <p>Episodes need a connection to stream. Reconnect and we'll pick up right where you stopped.</p>
            <button onclick="location.reload()">Try again</button>
        </div>
        <script>
            addEventListener('online', () => location.reload())
        </script>
    </body>
</html>
